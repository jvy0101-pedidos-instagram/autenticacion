        spring.application.name=autenticacion
        # Puerto local 8087. En Docker, Compose entrega SERVER_PORT=8080.
        server.port=${SERVER_PORT:8087}

        # Base de datos propia del microservicio (autenticacion_db).
        # createDatabaseIfNotExist crea la base automaticamente en MySQL local.
        spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/autenticacion_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
        spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
        spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

        # JPA / Hibernate crea y actualiza las tablas a partir de las entidades.
        spring.jpa.hibernate.ddl-auto=update
        spring.jpa.open-in-view=false
        spring.jpa.show-sql=true
        spring.jpa.properties.hibernate.format_sql=true
        # JWT: clave en Base64 y duracion del token (1 hora). Solo para laboratorio.
app.jwt.secret=${JWT_SECRET:Q2xhdmVEZURlbW9QYXJhSmF2YU5vYmVDb25Eb2NrZXIyMDI2IQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
